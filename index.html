<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Speed Typing Mavis</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css" />
</head>

<body data-theme="neo-dark">
  <button id="settings-btn" class="settings-btn" title="Toggle Settings" aria-label="Toggle Settings">
    <i class="fas fa-cog"></i>
  </button>

  <div id="settings" class="settings hide">
    <form id="settings-form">
      <div class="setting-item">
        <label for="difficulty"><i class="fas fa-sliders-h"></i> Difficulty</label>
        <div class="custom-select-wrapper">
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
      </div>
      <div class="setting-item">
        <label for="theme-select"><i class="fas fa-palette"></i> Theme</label>
        <div class="custom-select-wrapper">
          <select id="theme-select">
            <option value="neo-dark">Neo-Dark</option>
            <option value="cyberpunk">Cyberpunk</option>
            <option value="paper">Paper Minimal</option>
          </select>
        </div>
      </div>
    </form>
  </div>

  <div class="container">
    <h2>👩‍💻 Typing Mavis 👨‍💻</h2>
    <small>Type the following:</small>

    <h1 id="word"></h1>

    <input type="text" id="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
      placeholder="Type the word here..." autofocus />

    <p class="time-container">Time left: <span id="time">10s</span></p>

    <p class="score-container">Score: <span id="score">0</span></p>

    <div id="end-game-container" class="end-game-container"></div>
  </div>

  <script src="script.js"></script>
</body>

</html>
